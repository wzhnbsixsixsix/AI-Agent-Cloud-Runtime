# P0 validation only. Docker runtime name kata-qemu must really use QEMU.
[server]
host = "127.0.0.1"
port = 18082
max_sandbox_timeout_seconds = 600

[runtime]
type = "docker"
execd_image = "docker.io/opensandbox/execd@sha256:e11fdd6fa641329a1fe5298e71c8dd2afca742674fe48bc855b2ff6715512829"

[secure_runtime]
type = "kata"
docker_runtime = "kata-qemu"

[docker]
network_mode = "bridge"
no_new_privileges = true
pids_limit = 512

[egress]
image = "docker.io/opensandbox/egress@sha256:56429c89b7175c2a24af62ca93a99776f03ea67a0beb74d63c8ddb34ff16fd97"
mode = "dns+nft"
disable_ipv6 = true
readiness_timeout_seconds = 60.0

[proxy]
resolve_internal = true

[storage]
allowed_host_paths = []
